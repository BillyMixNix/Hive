name: Live A-B Seeded Coder Pilot

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  live-ab-seeded-coder:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "-1"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -q requests anthropic z3-solver radon pylint pytest

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        shell: bash
        run: |
          nohup ollama serve > ollama-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ollama-server.log
          exit 1

      - name: Pull configured Hive model
        run: ollama pull qwen2.5-coder:7b

      - name: Run seeded live-coder A-B experiment
        shell: bash
        run: |
          python - <<'PY' 2>&1 | tee live-ab-console.log
          import json
          import os
          import time
          from pathlib import Path

          import requests
          import coder as coder_module
          from validation.ab_run import run_sequence_ab
          from validation.experiment_cases import build_lesson_reuse_experiment_pack

          MODEL = "qwen2.5-coder:7b"
          OLLAMA_URL = "http://127.0.0.1:11434/api/generate"

          def bounded_live_coder(prompt, role="coder", timeout=None, model=None, system=None):
              started = time.time()
              response = requests.post(
                  OLLAMA_URL,
                  json={
                      "model": MODEL,
                      "prompt": prompt,
                      "stream": False,
                      "options": {
                          "temperature": 0,
                          "num_predict": 512,
                          "num_ctx": 8192,
                      },
                  },
                  timeout=600,
              )
              response.raise_for_status()
              payload = response.json()
              text = payload.get("response", "")
              print(json.dumps({
                  "event": "live_coder_response",
                  "elapsed_seconds": round(time.time() - started, 3),
                  "prompt_chars": len(prompt),
                  "response_chars": len(text),
              }, sort_keys=True))
              return text

          coder_module.ask_hive = bounded_live_coder

          cases = build_lesson_reuse_experiment_pack()
          reuse_case = cases[1]
          reuse_case.pop("coder_response", None)
          reuse_case["live_coder"] = True
          reuse_case["live_reflector"] = False

          report = run_sequence_ab(
              cases=cases,
              repeats=2,
              live_model=False,
              output_path="validation/results/live_seeded_coder_ab.json",
          )
          manifest = {
              "provider": "ollama",
              "model": MODEL,
              "commit": os.environ.get("GITHUB_SHA"),
              "scope": "seeded_live_coder_ab",
              "live_roles": ["coder"],
              "fixed_roles": ["planner", "reflector"],
              "case_names": [case["name"] for case in cases],
              "repeats": 2,
              "live_coder_executions": 4,
              "generation_options": {
                  "temperature": 0,
                  "num_predict": 512,
                  "num_ctx": 8192,
              },
              "report": report,
          }
          Path("validation/results/live_seeded_coder_ab_manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(json.dumps({
              "verdict": report["verdict"],
              "paired_summary": report["paired_summary"],
              "case_names": manifest["case_names"],
              "live_coder_executions": manifest["live_coder_executions"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload seeded live-coder evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ab-seeded-coder
          path: |
            validation/results/live_seeded_coder_ab.json
            validation/results/live_seeded_coder_ab_manifest.json
            live-ab-console.log
            ollama-server.log
          if-no-files-found: warn
