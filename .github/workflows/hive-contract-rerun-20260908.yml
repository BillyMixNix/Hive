name: Hive Public Contract Comparison Rerun

on:
  push:
    branches: [agent/hive-live-trial-20260908]
    paths: [experiments/learning-dev/contract-rerun-plan.json]

permissions:
  contents: read

concurrency:
  group: hive-authorized-continuation-20260908
  cancel-in-progress: false

jobs:
  study:
    if: github.repository == 'BillyMixNix/Hive' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out committed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify frozen rerun and cumulative spending
        working-directory: experiments/learning-dev
        run: python3 analysis/contract_rerun.py --check
      - name: Verify offline without a key
        working-directory: experiments/learning-dev
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/hive-env"
          "$RUNNER_TEMP/hive-env/bin/python" -m pip install 'pytest==9.1.1'
          "$RUNNER_TEMP/hive-env/bin/python" -m pytest -q tests -p no:cacheprovider --junitxml="$RUNNER_TEMP/hive-verification.xml"
          "$RUNNER_TEMP/hive-env/bin/python" analysis/contract_rerun_preflight.py "$RUNNER_TEMP/hive-rerun-preflight.json"
      - name: Run the authorized 45 recipient comparison once
        working-directory: experiments/learning-dev
        env:
          OPENAI_API_KEY: ${{ secrets.HIVE_OPENAI_API_KEY }}
        run: '"$RUNNER_TEMP/hive-env/bin/python" -u analysis/contract_rerun.py "$RUNNER_TEMP/hive-contract-evidence"'
      - name: Preserve observations and spending
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hive-contract-rerun-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hive-contract-evidence/
            ${{ runner.temp }}/hive-verification.xml
            ${{ runner.temp }}/hive-rerun-preflight.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
