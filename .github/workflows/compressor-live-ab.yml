name: Compressor Live A-B

on:
  workflow_dispatch:
  push:
    branches:
      - 'product/compressor-mvp'
    paths:
      - 'validation/compressor_live_ab.py'
      - 'hive_compressor/**'
      - '.github/workflows/compressor-live-ab.yml'

jobs:
  live-ab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      HIVE_AB_MODEL: claude-sonnet-4-6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install benchmark dependencies
        run: python -m pip install requests anthropic
      - name: Run paired live benchmark
        run: python validation/compressor_live_ab.py
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compressor-live-ab-result
          path: results/compressor_live_ab.json
          if-no-files-found: warn
