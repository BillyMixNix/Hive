name: Compressor Live A-B

on:
  workflow_dispatch:
  push:
    branches:
      - 'product/compressor-mvp'
    paths:
      - 'validation/compressor_live_ab.py'
      - 'validation/compressor_live_ab_ollama.py'
      - 'hive_compressor/**'
      - '.github/workflows/compressor-live-ab.yml'

jobs:
  live-ab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONPATH: ${{ github.workspace }}
      HIVE_AB_MODEL: qwen2.5-coder:1.5b
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Python benchmark dependency
        run: python -m pip install requests
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama and pull coder model
        run: |
          ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull "$HIVE_AB_MODEL"
      - name: Run paired live benchmark
        run: python validation/compressor_live_ab_ollama.py
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compressor-live-ab-result
          path: results/compressor_live_ab.json
          if-no-files-found: warn
