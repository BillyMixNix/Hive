name: Trial 003 c4 Causal-State Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'experiments/trial003/**'
      - 'tests/test_trial003_*.py'
      - '.github/workflows/trial003.yml'

jobs:
  trial003:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest requests
      - name: Run frozen external baseline and transition harness
        run: |
          set -o pipefail
          pytest -q \
            tests/test_trial003_transition_harness.py \
            tests/test_trial003_c4_baseline.py \
            2>&1 | tee trial003.log
      - name: Capture structured c4 probe evidence
        run: python experiments/trial003/c4_probe.py --output trial003_probe.json
      - name: Intake frozen RuneRay v0.7 archive
        shell: bash
        run: |
          set -euo pipefail
          target='experiments/trial003/runeray_engine_v0_7.zip'
          test -f "$target"
          sha256sum "$target" | tee runeray_v07_sha256.txt
          rm -rf /tmp/runeray_v07
          mkdir -p /tmp/runeray_v07
          unzip -q "$target" -d /tmp/runeray_v07
          {
            echo '# RuneRay v0.7 extracted tree'
            find /tmp/runeray_v07 -type f -printf '%P\n' | LC_ALL=C sort
          } | tee runeray_v07_tree.txt
          {
            echo '# package roots'
            find /tmp/runeray_v07 -type f -name package.json -not -path '*/node_modules/*' -printf '%h\n' | LC_ALL=C sort -u
          } | tee runeray_v07_package_roots.txt
          test "$(tail -n +2 runeray_v07_package_roots.txt | sed '/^$/d' | wc -l)" -ge 1
      - name: Upload Trial 003 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial003-evidence
          path: |
            trial003.log
            trial003_probe.json
            runeray_v07_sha256.txt
            runeray_v07_tree.txt
            runeray_v07_package_roots.txt
          if-no-files-found: warn
