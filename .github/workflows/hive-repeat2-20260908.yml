name: Hive Authorized Repeat 2

on:
  push:
    branches: [agent/hive-live-trial-20260908]
    paths: [.github/workflows/hive-repeat2-20260908.yml]

permissions:
  contents: read

concurrency:
  group: hive-authorized-repeat2-20260908
  cancel-in-progress: false

jobs:
  trial:
    if: >-
      github.repository == 'BillyMixNix/Hive' &&
      github.event_name == 'push' &&
      github.run_attempt == 1 &&
      github.event.before == '47eaad389a77b644ca1628c4d0f5c0f2f9ea597c' &&
      github.event.head_commit.message == 'Launch the authorized Hive diagnostic repeat 2'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out the exact trial source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Prepare Python and verify without a key
        working-directory: experiments/learning-dev
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/hive-env"
          "$RUNNER_TEMP/hive-env/bin/python" -m pip install 'pytest==9.1.1'
          "$RUNNER_TEMP/hive-env/bin/python" -m pytest -q tests -p no:cacheprovider --junitxml="$RUNNER_TEMP/hive-verification.xml"
      - name: Run the single authorized episode
        working-directory: experiments/learning-dev
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.HIVE_OPENAI_API_KEY }}
          HIVE_LAUNCH_PARENT: 47eaad389a77b644ca1628c4d0f5c0f2f9ea597c
        run: |
          "$RUNNER_TEMP/hive-env/bin/python" -u -m hive_learning.cloud_repeat "$RUNNER_TEMP/hive-repeat2-evidence"
      - name: Preserve trial evidence even if invalid
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hive-repeat2-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hive-repeat2-evidence/
            ${{ runner.temp }}/hive-verification.xml
          if-no-files-found: warn
          retention-days: 30

