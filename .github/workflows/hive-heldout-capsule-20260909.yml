name: Hive Heldout Real Bug Capsule Comparison
on:
  push:
    branches: [agent/state-packet-offline-20260909]
    paths: [experiments/learning-dev/examples/heldout-capsule-plan-20260909.json]
permissions:
  contents: read
concurrency:
  group: hive-packet-comparison-fresh-five-dollars-20260909
  cancel-in-progress: false
jobs:
  comparison:
    if: github.repository == 'BillyMixNix/Hive' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == 'f602b92a0216e29c0f370c6d92a6e66574609b98'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PLAN: examples/heldout-capsule-plan-20260909.json
      PLAN_SHA: 2d413c6a907c06931a1de497f2a0dafb20ce194bbc712ecf82a9d99fba25cf08
      ARCHIVE: examples/heldout-real-bugs-v1-20260909.zip
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Offline fixture and apparatus checks
        working-directory: experiments/learning-dev
        run: |
          python3 -m venv "$RUNNER_TEMP/heldout-env"
          "$RUNNER_TEMP/heldout-env/bin/python" -m pip install 'pytest==9.1.1'
          "$RUNNER_TEMP/heldout-env/bin/python" -m pytest -q tests -p no:cacheprovider
      - name: Construct summaries and compare twelve recipients once
        working-directory: experiments/learning-dev
        env:
          OPENAI_API_KEY: ${{ secrets.HIVE_OPENAI_API_KEY }}
        run: '"$RUNNER_TEMP/heldout-env/bin/python" -u analysis/heldout_trial.py run "$ARCHIVE" "$PLAN" --sha256 "$PLAN_SHA" --output "$RUNNER_TEMP/heldout-evidence"'
      - name: Rescore candidates and reconcile complete costs
        if: always()
        working-directory: experiments/learning-dev
        run: |
          "$RUNNER_TEMP/heldout-env/bin/python" analysis/heldout_trial.py audit "$ARCHIVE" "$RUNNER_TEMP/heldout-evidence" --sha256 "$PLAN_SHA" > "$RUNNER_TEMP/heldout-audit.json"
          cat "$RUNNER_TEMP/heldout-audit.json"
      - name: Preserve experiment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hive-heldout-capsule-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/heldout-evidence/
            ${{ runner.temp }}/heldout-audit.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
