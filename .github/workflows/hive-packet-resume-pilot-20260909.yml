name: Hive Packet Resume Pilot September 9
on:
  push:
    branches: [agent/state-packet-offline-20260909]
    paths: [experiments/learning-dev/examples/packet-resume-pilot-20260909.json]
permissions:
  contents: read
concurrency:
  group: hive-packet-comparison-fresh-five-dollars-20260909
  cancel-in-progress: false
jobs:
  pilot:
    if: github.repository == 'BillyMixNix/Hive' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == 'bcb6f1bc387fb0d94550dbac71e5527b199efa9c'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PLAN: examples/packet-resume-pilot-20260909.json
      PLAN_SHA: 22dae503e3c6a2ae73f3f7fac3a4a6d026040cf9069070220fac4bd157155934
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Offline checks without credentials
        working-directory: experiments/learning-dev
        run: |
          python3 -m venv "$RUNNER_TEMP/resume-env"
          "$RUNNER_TEMP/resume-env/bin/python" -m pip install 'pytest==9.1.1'
          "$RUNNER_TEMP/resume-env/bin/python" -m pytest -q tests -p no:cacheprovider
      - name: Run nine episodes once with prior spending included
        working-directory: experiments/learning-dev
        env:
          OPENAI_API_KEY: ${{ secrets.HIVE_OPENAI_API_KEY }}
        run: '"$RUNNER_TEMP/resume-env/bin/python" -u analysis/packet_resume_pilot.py run "$PLAN" --sha256 "$PLAN_SHA" --output "$RUNNER_TEMP/resume-evidence"'
      - name: Replay and reconcile without credentials
        if: always()
        working-directory: experiments/learning-dev
        run: '"$RUNNER_TEMP/resume-env/bin/python" analysis/packet_resume_pilot.py audit "$RUNNER_TEMP/resume-evidence" --sha256 "$PLAN_SHA" | tee "$RUNNER_TEMP/resume-audit.json"'
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hive-resume-pilot-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/resume-evidence/
            ${{ runner.temp }}/resume-audit.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
