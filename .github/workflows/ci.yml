name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies quietly
        run: python -m pip install -q -r requirements.txt
      - name: Write concise real A/B diagnostic
        run: |
          python - <<'PY'
          import io
          import json
          from contextlib import redirect_stdout
          from pathlib import Path
          from validation.ab_run import run_sequence_ab
          from validation.experiment_cases import build_lesson_reuse_experiment_pack

          observations = []
          captured = io.StringIO()
          with redirect_stdout(captured):
              report = run_sequence_ab(
                  cases=build_lesson_reuse_experiment_pack(observations),
                  repeats=2,
              )
          payload = {
              "verdict": report["verdict"],
              "paired_summary": report["paired_summary"],
              "repeat_records": report["repeat_records"],
              "observations": observations,
              "captured_tail": captured.getvalue().splitlines()[-20:],
          }
          Path("ab-diagnostic.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          PY
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: ab-diagnostic
          path: ab-diagnostic.json
