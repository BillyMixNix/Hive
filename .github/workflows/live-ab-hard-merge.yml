name: Live A-B Hard Recursive Merge

on:
  pull_request:
    branches: [ main ]

jobs:
  hard-live-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull configured Hive model
        run: ollama pull qwen2.5-coder:7b

      - name: Run hard behavioral A-B experiment
        shell: bash
        run: |
          mkdir -p validation/results
          set +e
          python - <<'PY' 2>&1 | tee validation/results/live_ab_hard_merge.log
          import validation.run_hard_merge_ab as experiment
          experiment.TARGET_FILE = "config_merge_target.py"
          experiment.CASE["target_file"] = experiment.TARGET_FILE
          experiment.main()
          PY
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload hard A-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ab-hard-recursive-merge
          path: |
            validation/results/live_ab_hard_merge.json
            validation/results/live_ab_hard_merge.log
          if-no-files-found: warn
