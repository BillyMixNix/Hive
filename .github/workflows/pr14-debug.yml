name: PR14 Debug

on:
  pull_request:
    branches: [ main ]

jobs:
  baseline-main:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch main
        run: git clone -q --depth 1 --branch main https://github.com/BillyMixNix/Hive.git .
      - name: Install dependencies quietly
        run: python -m pip install -q -r requirements.txt
      - name: Run main suite and print tail
        shell: bash
        run: |
          set +e
          pytest -q > /tmp/main-pytest.log 2>&1
          code=$?
          tail -n 45 /tmp/main-pytest.log
          exit $code

  branch-without-new-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PR branch
        run: git clone -q --depth 1 --branch agent/consolidate-validation-gate https://github.com/BillyMixNix/Hive.git .
      - name: Install dependencies quietly
        run: python -m pip install -q -r requirements.txt
      - name: Run branch suite without new gate tests and print tail
        shell: bash
        run: |
          set +e
          pytest -q --ignore=tests/test_empirical_validation_gate.py > /tmp/branch-pytest.log 2>&1
          code=$?
          tail -n 45 /tmp/branch-pytest.log
          exit $code
