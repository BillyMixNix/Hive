name: PR14 Debug

on:
  pull_request:
    branches: [ main ]

jobs:
  debug-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch branch
        run: |
          git clone -q --depth 1 --branch agent/consolidate-validation-gate https://github.com/BillyMixNix/Hive.git .
      - name: Install dependencies quietly
        run: python -m pip install -q -r requirements.txt
      - name: Run failing test with final-result tracing
        shell: bash
        run: |
          python - <<'PY'
          import unittest
          from coder import CoderAgent
          from tests.test_phase1_live_benchmark import Phase1LiveBenchmarkTests

          original = CoderAgent._finalize_generation_result
          def traced(self, *args, **kwargs):
              print("TRACE previous_failure_code=", kwargs.get("previous_failure_code"))
              print("TRACE candidate_failure_code=", (kwargs.get("candidate_patch_data") or {}).get("failure_code"))
              result = original(self, *args, **kwargs)
              print("TRACE final_result=", result)
              return result
          CoderAgent._finalize_generation_result = traced

          suite = unittest.TestSuite([
              Phase1LiveBenchmarkTests("test_phase1_benchmark_path_reporting")
          ])
          outcome = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if outcome.wasSuccessful() else 1)
          PY
