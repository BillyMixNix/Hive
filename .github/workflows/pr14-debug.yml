name: PR14 Debug

on:
  pull_request:
    branches: [ main ]

jobs:
  debug-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch branch
        run: |
          git clone -q --depth 1 --branch agent/consolidate-validation-gate https://github.com/BillyMixNix/Hive.git .
      - name: Install dependencies quietly
        run: python -m pip install -q -r requirements.txt
      - name: Run tests and print failure tail
        shell: bash
        run: |
          set +e
          pytest -q > /tmp/pytest.log 2>&1
          code=$?
          tail -n 60 /tmp/pytest.log
          exit $code
