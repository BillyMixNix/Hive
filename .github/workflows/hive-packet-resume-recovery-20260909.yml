name: Hive Packet Resume Final Episode Recovery
on:
  push:
    branches: [agent/state-packet-offline-20260909]
    paths: [experiments/learning-dev/examples/packet-resume-recovery-20260909.json]
permissions:
  contents: read
concurrency:
  group: hive-packet-comparison-fresh-five-dollars-20260909
  cancel-in-progress: false
jobs:
  recovery:
    if: github.repository == 'BillyMixNix/Hive' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == 'ee5daaba897795e359452676ecc1bee2e794e53e'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      RECOVERY_SHA: 8953f77f9b19afbd226e6fcd9cacb9273d13b063541ea14af6ff2eef386db86f
      ORIGINAL_SHA: 4743ae6c73154f4d5f36bf4066f9d81af7a4126399312fdc9bb33a847aa1cad9
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify recovery and duplicate response regression
        working-directory: experiments/learning-dev
        run: |
          python3 -m venv "$RUNNER_TEMP/recovery-env"
          "$RUNNER_TEMP/recovery-env/bin/python" -m pip install 'pytest==9.1.1'
          "$RUNNER_TEMP/recovery-env/bin/python" -m pytest -q tests/test_packet_resume_pilot.py tests/test_packet_resume_recover.py -p no:cacheprovider
      - name: Resume saved action with at most two new requests
        working-directory: experiments/learning-dev
        env:
          OPENAI_API_KEY: ${{ secrets.HIVE_OPENAI_API_KEY }}
        run: '"$RUNNER_TEMP/recovery-env/bin/python" analysis/packet_resume_recover.py run examples/packet-resume-recovery-20260909.json --sha256 "$RECOVERY_SHA" --archive examples/resume-pilot-v2-evidence.zip --output "$RUNNER_TEMP/recovered"'
      - name: Replay all nine episodes and reconcile both ledgers
        if: always()
        working-directory: experiments/learning-dev
        run: |
          "$RUNNER_TEMP/recovery-env/bin/python" analysis/packet_resume_pilot.py audit "$RUNNER_TEMP/recovered/resume-evidence" --sha256 "$ORIGINAL_SHA" > "$RUNNER_TEMP/recovery-audit.json"
          cat "$RUNNER_TEMP/recovery-audit.json"
      - name: Preserve combined evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hive-resume-recovered-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/recovered/
            ${{ runner.temp }}/recovery-audit.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
