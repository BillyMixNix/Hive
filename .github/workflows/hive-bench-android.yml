name: Hive Mobile Android

on:
  workflow_dispatch:
  push:
    branches:
      - 'product/hive-mobile'
    paths:
      - 'android/hive-bench/**'
      - 'validation/export_phone_benchmark.py'
      - 'validation/compressor_inwindow_ab.py'
      - 'validation/compressor_scale_ab.py'
      - 'validation/compressor_live_ab.py'
      - 'hive_compressor/**'
      - '.github/workflows/hive-bench-android.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      LLAMA_CPP_SHA: c841aeeb8bb2fe417038dadfa9b007cf1a9ef950
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/validation
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build frozen phone benchmark bundle
        run: |
          python -m pip install requests transformers tokenizers
          python validation/export_phone_benchmark.py --output /tmp/hive_bench_cases.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android native toolchain
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;29.0.13113456' \
            'cmake;3.31.6'

      - name: Fetch pinned llama.cpp Android binding
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git external/llama.cpp
          git -C external/llama.cpp checkout "$LLAMA_CPP_SHA"

      - name: Apply Hive Mobile overlay
        run: |
          APP=external/llama.cpp/examples/llama.android/app/src/main
          cp android/hive-bench/overlay/MainActivity.kt "$APP/java/com/example/llama/MainActivity.kt"
          cp android/hive-bench/overlay/activity_main.xml "$APP/res/layout/activity_main.xml"
          cp android/hive-bench/overlay/strings.xml "$APP/res/values/strings.xml"
          mkdir -p "$APP/res/drawable" "$APP/assets"
          cp android/hive-bench/overlay/drawable/*.xml "$APP/res/drawable/"
          sed -i 's/android:hintTextColor/android:textColorHint/g' "$APP/res/layout/activity_main.xml"
          cp /tmp/hive_bench_cases.json "$APP/assets/hive_bench_cases.json"

          python - <<'PY'
          from pathlib import Path

          cpp = Path('external/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp')
          text = cpp.read_text()
          text = text.replace('constexpr int   N_THREADS_MAX           = 4;', 'constexpr int   N_THREADS_MAX           = 6;')
          text = text.replace('constexpr int   DEFAULT_CONTEXT_SIZE    = 8192;', 'constexpr int   DEFAULT_CONTEXT_SIZE    = 32768;')
          cpp.write_text(text)
          assert 'DEFAULT_CONTEXT_SIZE    = 32768' in text
          assert 'N_THREADS_MAX           = 6' in text

          engine_impl = Path('external/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/internal/InferenceEngineImpl.kt')
          text = engine_impl.read_text()
          guard = '            check(_readyForSystemPrompt) { "System prompt must be set ** RIGHT AFTER ** model loaded!" }\n'
          assert guard in text, 'Pinned llama.cpp system-prompt guard changed unexpectedly'
          text = text.replace(guard, '            // Hive Mobile permits safe prompt/context reset while ModelReady.\n', 1)
          engine_impl.write_text(text)
          assert 'System prompt must be set ** RIGHT AFTER ** model loaded!' not in text

          lib_gradle = Path('external/llama.cpp/examples/llama.android/lib/build.gradle.kts')
          text = lib_gradle.read_text().replace(
              'abiFilters += listOf("arm64-v8a", "x86_64")',
              'abiFilters += listOf("arm64-v8a")',
          )
          lib_gradle.write_text(text)

          app_gradle = Path('external/llama.cpp/examples/llama.android/app/build.gradle.kts')
          text = app_gradle.read_text()
          text = text.replace('applicationId = "com.example.llama.aichat"', 'applicationId = "com.hive.mobile"')
          text = text.replace('versionName = "1.0"', 'versionName = "0.4.1"')
          text = text.replace('debug {\n            isMinifyEnabled = true\n            isShrinkResources = true', 'debug {\n            isMinifyEnabled = false\n            isShrinkResources = false')
          app_gradle.write_text(text)
          PY

      - name: Assemble arm64 debug APK
        working-directory: external/llama.cpp/examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Collect APK
        run: |
          mkdir -p dist
          cp external/llama.cpp/examples/llama.android/app/build/outputs/apk/debug/app-debug.apk dist/HiveMobile-v0.4.1-arm64.apk
          sha256sum dist/HiveMobile-v0.4.1-arm64.apk | tee dist/HiveMobile-v0.4.1-arm64.apk.sha256

      - name: Upload Hive Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: HiveMobile-v0.4.1-arm64
          path: dist/*
          if-no-files-found: error
