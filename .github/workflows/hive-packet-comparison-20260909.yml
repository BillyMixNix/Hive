name: Hive Packet Comparison September 9

on:
  push:
    branches: [agent/state-packet-offline-20260909]
    paths: [experiments/learning-dev/examples/packet-comparison-live-20260909.json]

permissions:
  contents: read

concurrency:
  group: hive-packet-comparison-fresh-five-dollars-20260909
  cancel-in-progress: false

jobs:
  comparison:
    if: github.repository == 'BillyMixNix/Hive' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == 'f255f1baed63451f277eeb65fe2cfe14fa163fd7'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PLAN: examples/packet-comparison-live-20260909.json
      PLAN_SHA: 5c049fae2e3f06162019d403077855bb34d0b97f61386bdbfa54a398202c9d70
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify source commitment and offline suite
        working-directory: experiments/learning-dev
        run: |
          python3 -m venv "$RUNNER_TEMP/packet-env"
          "$RUNNER_TEMP/packet-env/bin/python" -m pip install 'pytest==9.1.1'
          "$RUNNER_TEMP/packet-env/bin/python" analysis/packet_comparison.py check "$PLAN" --sha256 "$PLAN_SHA"
          "$RUNNER_TEMP/packet-env/bin/python" -m pytest -q tests -p no:cacheprovider
      - name: Run once under the fresh five dollar guard
        working-directory: experiments/learning-dev
        env:
          OPENAI_API_KEY: ${{ secrets.HIVE_OPENAI_API_KEY }}
        run: '"$RUNNER_TEMP/packet-env/bin/python" -u analysis/packet_comparison.py run "$PLAN" --sha256 "$PLAN_SHA" --output "$RUNNER_TEMP/packet-evidence"'
      - name: Independently audit saved evidence without credentials
        if: always()
        working-directory: experiments/learning-dev
        run: '"$RUNNER_TEMP/packet-env/bin/python" analysis/packet_audit.py "$RUNNER_TEMP/packet-evidence" --plan-sha256 "$PLAN_SHA" > "$RUNNER_TEMP/packet-audit.json"'
      - name: Preserve evidence and audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hive-packet-comparison-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/packet-evidence/
            ${{ runner.temp }}/packet-audit.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
