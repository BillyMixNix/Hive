name: Hive Context and Memory Checkpoint Comparison

on:
  push:
    branches: [agent/hive-live-trial-20260908]
    paths: [experiments/learning-dev/lesson-v5-plan.json]

permissions:
  contents: read

concurrency:
  group: hive-authorized-continuation-20260908
  cancel-in-progress: false

jobs:
  study:
    if: github.repository == 'BillyMixNix/Hive' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out committed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify frozen protocol and cumulative spending
        working-directory: experiments/learning-dev
        run: python3 analysis/lesson_bank_v5.py --check
      - name: Verify offline without a key
        working-directory: experiments/learning-dev
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/hive-env"
          "$RUNNER_TEMP/hive-env/bin/python" -m pip install 'pytest==9.1.1'
          "$RUNNER_TEMP/hive-env/bin/python" -m pytest -q tests -p no:cacheprovider --junitxml="$RUNNER_TEMP/hive-verification.xml"
      - name: Run the frozen checkpoint comparison phase
        working-directory: experiments/learning-dev
        env:
          OPENAI_API_KEY: ${{ secrets.HIVE_OPENAI_API_KEY }}
        run: '"$RUNNER_TEMP/hive-env/bin/python" -u analysis/lesson_bank_v5.py "$RUNNER_TEMP/hive-v5-evidence"'
      - name: Preserve complete observations and spending
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hive-v5-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hive-v5-evidence/
            ${{ runner.temp }}/hive-verification.xml
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
