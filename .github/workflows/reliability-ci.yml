name: Reliability Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  reliability-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies (light)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run reliability CI gate
        run: |
          python -u -m scripts.ci_gate
